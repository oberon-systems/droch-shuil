# commit-msg hook scripts are only written by `pre-commit install` when it is
# asked for that type.
default_install_hook_types: [pre-commit, commit-msg]

# A hook that declares no stage runs in every installed one, so at commit-msg
# it would lint .git/COMMIT_EDITMSG instead of the tree.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
        files: \.(py|md|ya?ml|toml)$
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        files: \.(py|md|ya?ml|toml)$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # Needs Node 22+, and without a pin pre-commit takes whichever node is first on PATH.
        language_version: lts

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      # The docs fonts are vendored so the site never reaches a CDN.
      - id: forbid-binary
        exclude: \.woff2$

  # `cz check` needs the wyld_cz provider .cz.yaml names, pinned in requirements.txt.
  - repo: local
    hooks:
      - id: commitizen
        name: Check the commit message
        entry: .venv/bin/cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: local
    hooks:
      # A pygrep hook fails when its pattern matches: any non-ASCII byte outside Markdown.
      - id: ascii-only
        name: ascii only
        language: pygrep
        entry: '[^\x00-\x7f]'
        types: [text]
        exclude: \.md$
