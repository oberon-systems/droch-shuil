[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suil"
version = "0.1.0"
description = "Balor configuration runner on top of pyinfra"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
suil = "suil.cli:cli"

# A module's tests get the fixtures without a conftest of their own, wherever
# they live. Registered at install time, so `pip install -e ./suil` again.
[project.entry-points.pytest11]
suil = "suil.testing"

# The package dir is the project dir: DESIGN.md names suil/libs/, not suil/suil/libs/.
[tool.setuptools]
packages = ["suil", "suil.libs"]

[tool.setuptools.package-dir]
suil = "."
