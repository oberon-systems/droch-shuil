---
name: Publish a suil module
description: Pack the module a <module>-<version> tag names and add it to the index of its source.

inputs:
  tag:
    description: The <module>-<version> tag to pack.
    default: ${{ github.ref_name }}
  index-url:
    description: URL of the source whose live index the archive is added to; a missing index starts a new one.
    default: ""
  out-dir:
    description: Directory the archive and index.yaml are written to.
    default: dist
  suil-version:
    description: droch-shuil to install; empty takes the ref of this action without its v.
    default: ""

outputs:
  dir:
    description: Directory holding the archive and index.yaml, to upload.
    value: ${{ inputs.out-dir }}

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Resolve the droch-shuil version
      id: suil
      shell: bash
      env:
        REF:     ${{ github.action_ref }}
        VERSION: ${{ inputs.suil-version }}
      run: echo "version=${VERSION:-${REF#v}}" >>"$GITHUB_OUTPUT"

    # The venv is cached in the calling repository, keyed by droch-shuil and Python.
    - name: Restore droch-shuil
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.suil-venv
        key: suil-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.suil.outputs.version }}

    - name: Install droch-shuil
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.suil.outputs.version }}
      run: |
        python -m venv ~/.suil-venv
        ~/.suil-venv/bin/pip install "droch-shuil==$VERSION"

    - name: Put suil on PATH
      shell: bash
      run: echo ~/.suil-venv/bin >>"$GITHUB_PATH"

    - name: Pack the module
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        OUT: ${{ inputs.out-dir }}
      run: suil pack "$TAG" "$OUT"

    - name: Add it to the index
      shell: bash
      env:
        OUT:       ${{ inputs.out-dir }}
        INDEX_URL: ${{ inputs.index-url }}
      run: suil index "$OUT" ${INDEX_URL:+--merge "$INDEX_URL"}
