---
name: Publish a suil module
description: Pack the module a <module>-<version> tag names and add it to the index of its source.

inputs:
  tag:
    description: The <module>-<version> tag to pack.
    default: ${{ github.ref_name }}
  index-url:
    description: URL of the source whose live index the archive is added to; empty on the first release.
    default: ""
  out-dir:
    description: Directory the archive and index.yaml are written to.
    default: dist
  suil-version:
    description: droch-shuil to install; empty takes the ref of this action without its v.
    default: ""

outputs:
  dir:
    description: Directory holding the archive and index.yaml, to upload.
    value: ${{ inputs.out-dir }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install droch-shuil
      shell: bash
      env:
        REF:     ${{ github.action_ref }}
        VERSION: ${{ inputs.suil-version }}
      run: pip install "droch-shuil==${VERSION:-${REF#v}}"

    - name: Pack the module
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        OUT: ${{ inputs.out-dir }}
      run: suil pack "$TAG" "$OUT"

    - name: Add it to the index
      shell: bash
      env:
        OUT:       ${{ inputs.out-dir }}
        INDEX_URL: ${{ inputs.index-url }}
      run: suil index "$OUT" ${INDEX_URL:+--merge "$INDEX_URL"}
